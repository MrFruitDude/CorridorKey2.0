<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1488 445" width="1488" height="445" role="img" aria-label="One video frame through the lookup" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;Noto Sans&quot;, Helvetica, Arial, sans-serif">
<title>One video frame through the lookup</title>
<desc>Unscaled 8-bit frames (video, PNG, JPEG) no longer run a float sRGB decode and asinh encode per pixel. Each view depends only on the 0-255 code value, so a cached 256-entry table of bfloat16 bit patterns, built by the same functions as the float path, replaces the per-pixel math. EXR, linear frame directories and scaled input keep the float path.</desc>
